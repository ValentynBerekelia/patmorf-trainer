name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Дозволи, потрібні для публікації на GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Паралельні деплої не потрібні: лишаємо тільки останній
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Збірка та перевірки
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Встановити залежності
        run: npm ci

      - name: Перевірка типів
        run: npm run typecheck

      - name: Перевірка даних і логіки
        run: node scripts/verify.mjs

      - name: Збірка
        run: npm run build

      - name: Налаштувати Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Завантажити артефакт
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Публікація
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Деплой на GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
